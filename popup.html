<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Assistant · 答题助手</title>
<style>
  :root {
    --panel: #ffffff;
    --bg: #f6f6f2;
    --line: rgba(0,0,0,.10);
    --line-soft: rgba(0,0,0,.06);
    --text: #1b1a17;
    --sub: #6e6a62;
    --dim: #98938a;
    --accent: #1b1a17;
    --accent-fg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 16px;
    font: 12px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .logo {
    width: 24px; height: 24px; border-radius: 8px; background: var(--accent);
    position: relative; flex: none;
  }
  .logo::before {
    content: ""; position: absolute; left: 20%; top: 30%; width: 52%; height: 34%;
    border-radius: 5px; background: var(--accent-fg);
  }
  .logo::after {
    content: ""; position: absolute; left: 56%; top: 62%; width: 26%; height: 26%;
    border-radius: 999px; background: var(--accent-fg);
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .brand span { font-weight: 400; color: var(--sub); margin-left: 6px; }
  .ver { margin-left: auto; font-size: 10px; color: var(--dim); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .k { width: 40px; color: var(--dim); flex: none; }
  .v { color: var(--text); }
  .v small { display: block; color: var(--dim); font-size: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; margin-left: auto; background: var(--dim); flex: none; }
  .dot.on { background: var(--text); }

  .actions { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text); padding: 9px 14px;
  }
  button:hover { border-color: var(--sub); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; padding: 11px 14px; }
  button.primary:disabled { opacity: .45; cursor: default; }
  .duo { display: flex; gap: 8px; }
  .duo button { flex: 1; }

  .foot {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft);
    display: flex; gap: 6px; color: var(--dim); font-size: 10px;
  }
  .foot .sign { margin-left: auto; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo"></div>
    <div class="brand">Assistant<span>答题助手</span></div>
    <div class="ver" id="ver"></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="k">接口</span>
      <span class="v" id="api">检测中…<small>—</small></span>
      <span class="dot" id="apiDot"></span>
    </div>
    <div class="row" id="statsRow">
      <span class="k">今日</span>
      <span class="v" id="stats">—</span>
    </div>
    <div class="row">
      <span class="k">页面</span>
      <span class="v" id="page">检测中…</span>
      <span class="dot" id="pageDot"></span>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="run">开始答题</button>
    <div class="duo">
      <button id="scan">只扫描</button>
      <button id="opts">设置</button>
    </div>
    <button id="balance">查询 API 余额</button>
    <div class="hint-line" id="balLine" style="font-size:11px;color:var(--dim);min-height:14px"></div>
  </div>

  <div class="foot">
    <span>Assistant</span>
    <span class="sign">by JF</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
