<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>本地测试页 · 模拟学习通作业</title>
<style>
  body { font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; }
  .questionLi { border: 1px solid #e2e2e6; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .mark_name { font-size: 13px; color: #8a8a94; margin: 0 0 8px; }
  .Zy_TItle { font-weight: 600; margin-bottom: 8px; }
  .Zy_ulTop { list-style: none; padding: 0; margin: 0; }
  .Zy_ulTop li { padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .Zy_ulTop li:hover { background: #f2f4f8; }
  input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<h2>模拟作业（仅用于测试插件，不联网、不提交）</h2>

<div class="questionLi">
  <h3 class="mark_name colorDeep">1.（单选题）</h3>
  <div class="Zy_TItle"><div class="clearfix"><i>1.</i> 中国的首都是哪座城市？</div></div>
  <ul class="Zy_ulTop">
    <li><label><input type="radio" name="q1" value="A"><a>A. 北京</a></label></li>
    <li><label><input type="radio" name="q1" value="B"><a>B. 上海</a></label></li>
    <li><label><input type="radio" name="q1" value="C"><a>C. 广州</a></label></li>
    <li><label><input type="radio" name="q1" value="D"><a>D. 深圳</a></label></li>
  </ul>
</div>

<div class="questionLi">
  <h3 class="mark_name colorDeep">2.（判断题）</h3>
  <div class="Zy_TItle"><div class="clearfix"><i>2.</i> 水的化学式是 H2O。</div></div>
  <ul class="Zy_ulTop">
    <li><label><input type="radio" name="q2" value="A"><a>A. 对</a></label></li>
    <li><label><input type="radio" name="q2" value="B"><a>B. 错</a></label></li>
  </ul>
</div>

<div class="questionLi">
  <h3 class="mark_name colorDeep">3.（多选题）</h3>
  <div class="Zy_TItle"><div class="clearfix"><i>3.</i> 以下哪些属于编程语言？</div></div>
  <ul class="Zy_ulTop">
    <li><label><input type="checkbox" name="q3" value="A"><a>A. Python</a></label></li>
    <li><label><input type="checkbox" name="q3" value="B"><a>B. HTML</a></label></li>
    <li><label><input type="checkbox" name="q3" value="C"><a>C. Rust</a></label></li>
    <li><label><input type="checkbox" name="q3" value="D"><a>D. Photoshop</a></label></li>
  </ul>
</div>

<div class="questionLi">
  <h3 class="mark_name colorDeep">4.（填空题）</h3>
  <div class="Zy_TItle"><div class="clearfix"><i>4.</i> 一年有 ______ 个月。</div></div>
  <div><input type="text" name="q4" placeholder="请填写" /></div>
</div>

<div class="questionLi">
  <h3 class="mark_name colorDeep">5.（简答题）</h3>
  <div class="Zy_TItle"><div class="clearfix"><i>5.</i> 简述牛顿第一定律。</div></div>
  <div><textarea name="q5" placeholder="请输入答案"></textarea></div>
</div>

<p style="color:#8a8a94;font-size:12px">插件应从右下角出现「AI 答题」面板。点「只扫描」应打印 5 题。</p>
</body>
</html>
